<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>3-3차시 일제 통치와 저항 · 교과서판 한국사 게임</title>
<style>.sendbox{display:flex;flex-direction:column;align-items:center;gap:.6cqw}
.send{display:flex;gap:1cqw;align-items:center}
.send input{font:inherit;font-size:2cqw;padding:.8cqw 1.4cqw;border-radius:1.2cqw;border:.25cqw solid var(--ochre);background:var(--paper);color:var(--ink);width:26cqw}
.send-a{font-size:2.2cqw;padding:.9cqw 2.4cqw;text-decoration:none;display:inline-block;white-space:nowrap}
.send-a.off{opacity:.45;pointer-events:none}
.send-tip{font-size:1.5cqw;color:var(--ash)}
.send-tip b{color:var(--ember)}
.endbtns{display:flex;gap:1.6cqw}
.title .tally{margin-block:.4cqw}

.send-go{font-size:2.6cqw;padding:1.1cqw 3.4cqw;animation:sgo 1.6s ease-in-out infinite}
@keyframes sgo{50%{transform:scale(1.05)}}
.sendscr{position:absolute;inset:0;z-index:15;background:rgba(10,12,18,.72);display:grid;place-items:center}
.sbox{position:relative;width:84%;max-height:94%;background:var(--paper);color:var(--ink);border-radius:2cqw;padding:2.2cqw 3cqw;display:flex;flex-direction:column;gap:1.2cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.5)}
.sbox h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:3.4cqw;text-align:center}
.sscore{text-align:center;font-size:2cqw}
.sscore b{color:var(--ochre-deep);font-size:2.4cqw}
.ssteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1cqw}
.ssteps li{display:flex;gap:1.4cqw;align-items:flex-start;background:rgba(0,0,0,.05);border-radius:1.2cqw;padding:1cqw 1.4cqw;transition:opacity .3s}
.ssteps li.wait{opacity:.4}
.ssteps .sn{flex:none;width:3.6cqw;height:3.6cqw;border-radius:50%;display:grid;place-items:center;background:var(--ochre);color:var(--paper);font-family:var(--f-display);font-size:2cqw}
.ssteps li.ok .sn{background:var(--moss)}
.ssteps li>div{display:flex;flex-wrap:wrap;align-items:center;gap:.8cqw 1.4cqw;min-width:0;flex:1}
.ssteps li b{font-size:2.1cqw}
.ssteps small{flex-basis:100%;font-size:1.6cqw;color:#5e584c}
.ssteps input{font:inherit;font-size:2cqw;padding:.6cqw 1.2cqw;border-radius:1cqw;border:.25cqw solid var(--ochre);background:#fff;color:var(--ink);width:24cqw}
.ssteps .big{font-size:2cqw;padding:.7cqw 2.2cqw}
.ssteps .big[disabled]{opacity:.45}
.sback{position:absolute;left:2cqw;top:2cqw;color:var(--ink);background:transparent;border-color:#b9ab98}
.sthanks{text-align:center;font-size:2cqw;line-height:1.6;margin:0}
.sbox .endbtns{justify-content:center}

.devp{position:absolute;right:2%;top:12%;bottom:4%;width:40%;z-index:30;background:rgba(20,24,32,.96);color:#f3ecdc;border:.2cqw solid #f2c45a;border-radius:1.4cqw;display:flex;flex-direction:column;overflow:hidden}
.devh{display:flex;align-items:center;gap:1cqw;padding:1cqw 1.4cqw;border-bottom:1px solid #3b4658;flex-wrap:wrap}
.devh b{font-size:1.9cqw;color:#f2c45a}
.devh span{font-size:1.3cqw;color:#aeb4bd;flex:1;min-width:0}
.devl{overflow:auto;padding:.8cqw;display:flex;flex-direction:column;gap:.5cqw}
.devi{flex:none;text-align:left;background:#232c3a;color:#f3ecdc;border:1px solid #3b4658;border-radius:.8cqw;padding:.7cqw 1cqw;font-size:1.6cqw;cursor:pointer;line-height:1.3}
.devi:hover{border-color:#f2c45a}
.devi.devend{background:#8a5a1c;border-color:#f2c45a}
.shake{animation:kshake .4s}
@keyframes kshake{25%{transform:translateX(-1cqw)}50%{transform:translateX(1cqw)}75%{transform:translateX(-.5cqw)}}
.title .endbtns{flex-wrap:wrap;justify-content:center}
/* 귀환 퀴즈: 시험지 모양 */
.exam{position:absolute;inset:8.4cqw 4cqw 1.6cqw;background:#fbf7ec;color:#231c14;border-radius:1.2cqw;box-shadow:0 .6cqw 2cqw rgba(0,0,0,.35);padding:2cqw 2.4cqw;overflow:auto;display:flex;flex-direction:column;gap:1.4cqw;font-size:1.75cqw;line-height:1.5}
.exam .xq{font-size:2.05cqw;font-weight:700}.exam .xq small{font-weight:400;color:#6b5f4f;font-size:1.5cqw}
.exam .xn{color:#a5562b}
.exam .xsrc{display:flex;gap:1.4cqw;align-items:center}
.exam .xsrc>*{flex:1;min-width:0}
.exam .xph{margin:0;flex:0 1 auto;max-width:42%;display:flex;flex-direction:column;align-items:center;gap:.4cqw}
.exam .xsrc:not(.two) .xph{max-width:60%;margin-inline:auto}
.exam .xph img{max-width:100%;max-height:15cqw;object-fit:contain;border:1px solid #cdbfa5;border-radius:.4cqw;background:#fff}
.exam .xph figcaption{font-size:1.4cqw;color:#6b5f4f}
.exam .xbox{border:.2cqw solid #5a4a36;border-radius:.4cqw;padding:1cqw 1.4cqw;background:#fff}
.exam .xt{display:block;text-align:center;margin-bottom:.4cqw}
.exam .xtalk{display:flex;flex-direction:column;gap:.6cqw}
.exam .xb{background:#fff;border:1px solid #cdbfa5;border-radius:1cqw;padding:.6cqw 1.2cqw;max-width:88%}
.exam .xb.r{align-self:flex-end;background:#f1ead9}
.exam .xb b{font-size:1.4cqw;color:#a5562b}.exam .xb p{margin:0}
.exam .xopts{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw}
.exam .xopts.ph{grid-template-columns:repeat(4,1fr)}
.exam .xo{display:flex;align-items:center;gap:.8cqw;text-align:left;background:#fff;border:.2cqw solid #d9ccb2;border-radius:.8cqw;padding:.8cqw 1.2cqw;cursor:pointer;color:inherit;font:inherit}
.exam .xopts.ph .xo{flex-direction:column;align-items:stretch;text-align:center}
.exam .xo:hover:not(:disabled){border-color:#a5562b}
.exam .xnum{font-size:2.1cqw;color:#a5562b;flex:none}
.exam .xoph img{width:100%;height:9cqw;object-fit:cover;border-radius:.4cqw}
.exam .xo.xok{border-color:#3f8a5c;background:#e6f4ea}
.exam .xo.xbad{border-color:#c0473a;background:#fbe6e2}
.exam .xo:disabled{cursor:default}
.exam .xexp{display:flex;gap:1.4cqw;align-items:center;justify-content:space-between;background:#f1ead9;border-radius:.8cqw;padding:1cqw 1.4cqw}
.exam .xexp[hidden]{display:none}
.exam .xexp p{margin:.3cqw 0 0}
.exam .xexp .ok{color:#2f6b4a}.exam .xexp .no{color:#b23b2a}
.exam .xnext{flex:none;background:#a5562b;color:#fff;border:0;border-radius:.8cqw;padding:1cqw 2cqw;font:inherit;font-size:2cqw;font-weight:700;cursor:pointer}
/* 지도·문서 사진은 잘리지 않게 통째로 보이기 */
.card .pic.photo.fit{width:24cqw;height:22cqw;background:#f4ead6}
.card .pic.photo.fit img{width:24cqw;height:22cqw;object-fit:contain}
.recap .g .ph.fit img{object-fit:contain}
.recap .g .ph.fit{background:#f4ead6}
.card .pic.photo img{cursor:zoom-in}
.zoomph{position:absolute;inset:0;z-index:60;border:0;padding:2cqw;background:rgba(10,8,6,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;cursor:zoom-out}
.zoomph img{height:84%;width:auto;max-width:92%;object-fit:contain;border-radius:.6cqw;background:#f4ead6}
.zoomph span{color:#f3ecdc;font-size:1.7cqw}
.card:has(.pic.photo) .close::after{content:' · 사진을 누르면 크게 보여요'}

/* 오른쪽 위 묶음을 한 줄로: [모은 것 아이콘][◀ 이전][처음부터] — 버튼이 문제를 가리지 않게 (2026-10-12) */
.hud .right{flex-direction:row;justify-content:flex-end;align-items:flex-start;flex-wrap:nowrap}
.hud .camp{max-width:38cqw;flex-wrap:wrap;justify-content:flex-end}
.hud .row-btn{flex-shrink:0}

/* 패드·휴대폰을 세로로 들면 '가로로 돌려 주세요' (2026-10-12 오후b): 세로 + 터치 화면에서만 보임 */
.ptip{display:none}
@media (orientation:portrait) and (pointer:coarse){
  .ptip:not(.off){display:flex;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(12,14,20,.92);padding:24px}
  .ptip .pbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:#f3ecdc;font-family:"Gowun Dodum","Noto Sans KR",sans-serif}
  .ptip .pic{width:120px;height:120px;color:#f2c45a;animation:ptipr 2.2s ease-in-out infinite}
  .ptip b{font-size:26px;font-weight:700}
  .ptip span{font-size:17px;color:#c9c2b4}
  .ptip button{margin-top:10px;font:inherit;font-size:15px;color:#c9c2b4;background:transparent;border:1px solid #6b6458;border-radius:10px;padding:8px 16px}
  .rotate{display:none!important}
}
@keyframes ptipr{0%,30%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}

/* 2026-10-19 '처음부터' 확인 창 */
.rsask{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:rgba(12,10,8,.62)}
.rsask .rsbox{width:min(70%,640px);background:var(--paper,#f4ead6);color:var(--ink,#2a1d14);border-radius:2cqw;padding:2.4cqw 3cqw;text-align:center;box-shadow:0 1cqw 3cqw rgba(0,0,0,.4)}
.rsask h2{margin:0 0 1cqw;font-size:2.8cqw}
.rsask p{margin:0 0 1.6cqw;font-size:1.8cqw;line-height:1.6}
.rsask .endbtns{justify-content:center}
.rsask .endbtns .big{white-space:nowrap}

/* ===== 이름 쓰기 · 유물 카드 · 나만의 작은 박물관 ===== */
.pname .pnrow{display:flex;gap:1.6cqw;justify-content:center}
.pname label{display:flex;flex-direction:column;align-items:flex-start;gap:.5cqw;font-size:1.8cqw;color:var(--ember);font-family:var(--f-display)}
.pname input{font:inherit;font-size:2.6cqw;padding:.9cqw 1.2cqw;border-radius:1cqw;border:.3cqw solid var(--ochre);background:var(--paper);color:var(--ink);width:8cqw;text-align:center}
.pname label.w input{width:24cqw;text-align:left}
.pname .btns{display:flex;gap:1.4cqw}


/* 유물 카드: 전시 설명판처럼 차분하게 */
.relicpop{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;margin:0;font:inherit;display:grid;place-items:center;z-index:21;cursor:pointer;background:rgba(12,11,14,.78);animation:bin .3s}
.relicpop .rcard{display:flex;align-items:stretch;width:66cqw;background:#f4efe4;border-radius:.6cqw;overflow:hidden;box-shadow:0 2cqw 5cqw rgba(0,0,0,.5);text-align:left;color:#2b2622;animation:rup .45s cubic-bezier(.2,.8,.3,1)}
.relicpop .rcase{position:relative;flex:none;width:24cqw;background:linear-gradient(#24222a,#16151a);overflow:hidden}
.relicpop .rlight{position:absolute;left:50%;top:-10%;width:30cqw;height:42cqw;margin-left:-15cqw;background:radial-gradient(ellipse 45% 70% at 50% 0,rgba(255,240,205,.5),rgba(255,240,205,.08) 70%,transparent);pointer-events:none}
.relicpop .rart{position:absolute;left:50%;top:44%;width:14cqw;height:14cqw;transform:translate(-50%,-50%);display:grid;place-items:center;filter:drop-shadow(0 1.2cqw 1cqw rgba(0,0,0,.55))}
.relicpop .rart svg{width:100%;height:100%}
.relicpop .rplinth{position:absolute;left:50%;bottom:0;width:15cqw;height:9cqw;margin-left:-7.5cqw;background:linear-gradient(#e9e3d6,#c9c1b1);box-shadow:inset 0 .4cqw 0 #fff8ea}
.relicpop .rinfo{padding:2.4cqw 2.6cqw 2cqw;flex:1}
.relicpop .rk{font-size:1.3cqw;letter-spacing:.15em;color:#8a7f70}
.relicpop h3{margin:.5cqw 0 .3cqw;font-family:var(--f-display);font-weight:700;font-size:3cqw;letter-spacing:-.01em}
.relicpop .rcap{font-size:1.45cqw;color:#7a6f60;padding-bottom:.9cqw;border-bottom:.15cqw solid #d8cfbf}
.relicpop p{margin:1cqw 0 0;font-size:1.75cqw;line-height:1.55}
.relicpop .rpt{margin-top:1.4cqw;font-size:1.6cqw;color:#5b4f40}
.relicpop .rpt b{font-size:2.2cqw;color:#9b3a22;font-family:var(--f-display)}
.relicpop .rsave{margin-top:.3cqw;font-size:1.3cqw;color:#9a8f80}
.relicpop .tap{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-size:1.7cqw;color:#cfc8bb;opacity:0;transition:opacity .3s;white-space:nowrap}
.relicpop.ready .tap{opacity:1}
.rph{width:100%;height:100%;padding:.5cqw;background:#fff;box-shadow:0 0 0 .3cqw #6b5a3a}
.rph img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes rup{from{opacity:0;transform:translateY(2cqw)}to{opacity:1;transform:none}}

/* 나만의 작은 박물관 */
.mus{position:absolute;inset:0;z-index:15;overflow:hidden;color:#f1ece2;font-family:inherit}
.mus .mwall{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 30%,#2b2830,#151418 75%);transition:background 1.2s}
.mus.open .mwall{background:radial-gradient(ellipse 85% 70% at 50% 30%,#4a4148,#25212a 80%)}
.mus .mfloor{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(#1c1a1f,#0e0d10);border-top:.2cqw solid #3a363e;transition:background 1.2s}
.mus.open .mfloor{background:linear-gradient(#3a3036,#1d181c)}
.mus .mhead{position:absolute;left:0;right:0;top:4.5%;text-align:center;opacity:.25;transition:opacity 1.2s}
.mus.open .mhead{opacity:1}
.mus .mhead small{font-size:1.4cqw;letter-spacing:.3em;color:#bdb3a2}
.mus .mhead h2{margin:.5cqw 0 .4cqw;font-family:var(--f-display);font-weight:700;font-size:3.6cqw;letter-spacing:.04em;color:#f4ecd8}
.mus .mby{display:inline-block;font-size:1.6cqw;color:#cfc4b0;padding-top:.5cqw;border-top:.12cqw solid rgba(220,205,180,.4)}
.mus .mby b{color:#f2d79a;font-weight:700;margin-left:.4cqw}
.mrow{position:absolute;left:4%;right:4%;top:27%;bottom:12%;display:flex;justify-content:center;gap:2.2cqw}
.mcase{position:relative;flex:0 1 19cqw;border:0;padding:0;background:none;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.mcase .mlight{position:absolute;left:50%;top:-62%;width:26cqw;height:150%;margin-left:-13cqw;clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,238,200,.34),rgba(255,238,200,.12) 60%,rgba(255,238,200,0));opacity:0;transition:opacity .7s;pointer-events:none}
.mcase .mglass{position:relative;width:15cqw;height:15cqw;border:.15cqw solid rgba(255,255,255,.12);border-bottom:0;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 50%,rgba(255,255,255,.05));display:grid;place-items:center}
.mcase .mart{width:11cqw;height:11cqw;display:grid;place-items:center;opacity:.06;filter:grayscale(1) brightness(.5);transition:opacity .9s,filter .9s,transform .9s;transform:translateY(.4cqw)}
.mcase .mart svg{width:100%;height:100%}
.mcase .mplinth{width:16.5cqw;height:7cqw;background:linear-gradient(#5a5560,#3a363f);transition:background .9s}
.mcase .mlabel{margin-top:1.4cqw;width:17cqw;padding:.9cqw 1cqw;background:rgba(244,239,228,.08);border-left:.3cqw solid rgba(242,215,154,.25);text-align:left;opacity:.2;transition:opacity .9s,background .9s,border-color .9s;display:block}
.mcase .mlabel i{display:block;font-style:normal;font-size:1.15cqw;letter-spacing:.2em;color:#a99f8e}
.mcase .mlabel b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.9cqw;line-height:1.25;margin:.2cqw 0}
.mcase .mlabel small{display:block;font-size:1.25cqw;color:#c8bfaf;line-height:1.35}
.mcase.lit .mlight{opacity:1}
.mcase.lit .mart{opacity:1;filter:drop-shadow(0 1cqw .8cqw rgba(0,0,0,.6));transform:none}
.mcase.lit .mplinth{background:linear-gradient(#ece6d9,#c4bcab)}
.mcase.lit .mlabel{opacity:1;background:rgba(244,239,228,.12);border-left-color:#f2d79a}
.mus.open .mcase:hover .mglass,.mus.open .mcase:focus-visible .mglass{border-color:rgba(242,215,154,.6)}
.mfoot{position:absolute;left:4%;right:3%;bottom:1.6%;display:flex;align-items:center;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity .8s .4s}
.mus.open .mfoot{opacity:1;pointer-events:auto}
.mfoot .mhint{font-size:1.5cqw;color:#cfc4b0}
.mus .mskip{position:absolute;right:2%;top:3%;opacity:.7}
.mtip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56cqw;display:flex;gap:2cqw;align-items:center;padding:2cqw 2.4cqw;border-radius:.6cqw;background:#f4efe4;color:#2b2622;z-index:7;box-shadow:0 1.6cqw 4cqw rgba(0,0,0,.6);cursor:pointer;animation:rup .3s}
.mtip .ma{flex:none;width:11cqw;height:11cqw;display:grid;place-items:center}
.mtip .ma svg{width:100%;height:100%}
.mtip small{font-size:1.35cqw;color:#7a6f60}
.mtip strong{display:block;font-family:var(--f-display);font-size:2.6cqw;margin:.2cqw 0 .4cqw}
.mtip p{margin:0;font-size:1.7cqw;line-height:1.55}
.mtip p b{color:#7a3f1c}
.mtip>span{position:absolute;right:1.4cqw;bottom:.8cqw;font-size:1.2cqw;color:#9a8f80}

.mfoot .big{font-size:2.2cqw;padding:.8cqw 2.6cqw}

/* 유물 카드·박물관 위에서도 ◀ 이전·처음부터 버튼을 누를 수 있게 (2026-10-15) */
.hud .row-btn{position:relative;z-index:22;pointer-events:auto}

/* 유물 카드 아래 진열장 줄: 모은 칸은 불이 켜지고, 이번 유물이 빈 칸으로 쏙 (2026-10-15) */
.relicpop .rwrap{display:flex;flex-direction:column;align-items:center;gap:1.6cqw;margin-bottom:3cqw}
.relicpop .rstrip{display:flex;flex-direction:column;align-items:center;gap:.6cqw}
.relicpop .rnum{font-size:1.45cqw;letter-spacing:.08em;color:#cfc8bb}
.relicpop .rnum b{color:#f2c45a;font-size:1.9cqw}
.relicpop .rslots{display:flex;gap:1.2cqw}
.relicpop .rslot{position:relative;width:8.4cqw;display:flex;flex-direction:column;align-items:center}
.relicpop .rsl{position:absolute;left:50%;top:-.8cqw;width:9cqw;height:8.4cqw;margin-left:-4.5cqw;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,238,200,.45),rgba(255,238,200,.05));opacity:0;transition:opacity .5s;pointer-events:none}
.relicpop .rsa{position:relative;box-sizing:border-box;width:8.4cqw;height:6.8cqw;display:grid;place-items:center;padding:.6cqw;overflow:visible;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:.12cqw solid rgba(255,255,255,.14);border-bottom:0}
.relicpop .rsa svg{width:100%;height:100%}
.relicpop .rsa>*{max-width:100%;max-height:100%}
.relicpop .rsa .rph{box-sizing:border-box;width:5.6cqw;height:5.6cqw;padding:.22cqw;box-shadow:0 0 0 .12cqw #6b5a3a}
.relicpop .rslot:not(.on) .rsa::after{content:'?';font-family:var(--f-display);font-size:2.4cqw;color:rgba(255,255,255,.14)}

<style>

/* 교과서판 글꼴: 두꺼운 제목 글꼴(Black Han Sans) 대신 본문 글꼴(고운돋움)을 굵게 써서 읽기 쉽게 (2026-10-08) */
:root{--f-display:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.big,.burst .lab,.burst .num,.burst .tap,.card .tag,.card h3,.counter,.credits h2,.dface,.maplabel,.mcard b,.opt span,.recap .g b,.recap .score,.recap h2,.sbox h2,.ssteps .sn,.score-pill .sc,.sortcard b,.st .n,.tally b,.tally i,.title h1,.ask,.steps i{font-weight:700;letter-spacing:-.01em}
</style>

<div class="frame"><div class="inner">
  <div class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="chars" id="chars"></div>
    <div class="hot" id="hot"></div>
    <div class="ui" id="ui"></div>
  </div>
  <p class="rotate">휴대폰은 가로로 돌리면 더 크게 볼 수 있어요.</p>
</div></div>

<script>
/* ===== 모든 차시 공통: 시간 여행 / 귀환 퀴즈 · 점수 보내기 · 이어서 하기 · 제작자 바로가기 =====
   주소 # 뒤 조각을 ~로 이어 받음:  <반 코드>~quiz~dev
   반 코드: f<설문ID>.<항목번호 5~7개>  항목 순서: 이름, 차시, 시간 여행 점수, 귀환 퀴즈 점수, 총점, (틀린 선택), (궁금한 점) */
const INHUB = (()=>{ try{ return window.parent!==window && !!window.parent.__HANGUKSA_HUB__; }catch(e){ return false; } })();
const HASH = (()=>{ try{ return decodeURIComponent(location.hash.slice(1)); }catch(e){ return ''; } })();
const PARTS = HASH.split('~');
const DEV = PARTS.includes('dev');
const CLASSCODE = PARTS.find(p=>/^f[A-Za-z0-9_-]{20,}(\.\d+){5,7}$/.test(p))||'';
let MODE = PARTS.includes('quiz') ? 'quiz' : 'travel';
const STAGE = ()=> MODE==='quiz' ? '귀환 퀴즈' : '시간 여행';

function goHome(){ if(INHUB) window.parent.postMessage({hanguksa:'home'},'*'); }
function reportDone(stage,score){ if(INHUB) window.parent.postMessage({hanguksa:'done',kind:stage==='귀환 퀴즈'?'quiz':'travel',stage,score},'*'); }
function wrongLabel(label,topic){ let t=String(label||'').replace(/<[^>]+>/g,'').replace(/\s*\/\s*/g,', ').trim(); if(t&&topic) t=`[${topic}] ${t}`; return t; }
function noteWrong(label,topic){ const t=wrongLabel(label,topic); if(!t) return; S.wrong=S.wrong||[]; if(!S.wrong.includes(t)) S.wrong.push(t); if(MODE==='travel') setTimeout(firstTrack,0); }
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

/* ===== 첫 도전 기록 (2026-10-19): '처음부터'·새로 고침으로 점수를 다시 받지 못하게 =====
   같은 기기 · 같은 차시 · 같은 번호·이름으로 '처음 고른 답'을 기기에 남김(hanguksa_first_<차시>_<번호이름>).
   - 시간 여행: 처음에 틀린 선택은 다시 해도 '다시 풀어 맞혔어요' 점수(PT.retry)만, 틀린 기록은 계속 남음.
                선생님께 보내는 점수는 처음 끝까지 한 판(첫 도전)의 점수.
   - 귀환 퀴즈: 문제마다 처음 고른 답으로 점수를 매겨 보냄. 다시 풀기는 연습(화면에만 이번 점수).
   - 보낼 때 차시 칸에 ' · 첫 도전' / ' · 다시 여행 n회' / ' · 다시 풀기 n회'가 붙음 → 우리 반 결과 학생별 표에 '다시 n'
   - 제작자 확인 모드(DEV)에서는 기록하지도, 얹지도 않음 */
const FKEY=()=>'hanguksa_first_'+LESSON.id+'_'+((typeof playerLabel==='function'?playerLabel():'').replace(/\s+/g,'')||'noname');
function firstRec(){ const r=store.get(FKEY(),null)||{}; r.t=Object.assign({done:{},wrong:[],sim:null,runs:0},r.t); r.q=Object.assign({ans:{},wrong:[],runs:0},r.q); return r; }
function firstSave(r){ if(!DEV) store.set(FKEY(),r); }
/* 이 학생의 지난 기록을 지금 판에 얹기: 처음에 틀린 선택은 'w'로 표시, 틀린 기록은 이어 붙임 */
function firstJoin(){
  if(DEV||MODE!=='travel'||!S||S._fj) return; S._fj=1;
  const r=firstRec(); S.done=S.done||{};
  Object.entries(r.t.done).forEach(([k,v])=>{ if(v==='w'&&S.done[k]!=='ok') S.done[k]='w'; });
  S.wrong=[...new Set([...(r.t.wrong||[]),...(S.wrong||[])])];
}
/* 지금 판에서 처음 고른 답을 기록에 더하기 (장면이 바뀔 때·틀렸을 때 부름) */
function firstTrack(){
  if(DEV||MODE!=='travel'||!S) return null;
  firstJoin(); const r=firstRec();
  if(!S._fc){ S._fc=1; r.t.runs++; }
  Object.entries(S.done||{}).forEach(([k,v])=>{ if(!(k in r.t.done)) r.t.done[k]=v; });
  r.t.wrong=[...new Set([...r.t.wrong,...(S.wrong||[])])];
  firstSave(r); return r;
}
const tryTag=(n,word)=>DEV?'':(n<=1?' · 첫 도전':` · ${word} ${n-1}회`);

/* '처음부터'(진행 중): 한 번 묻고, 처음 장면으로 가되 점수·고른 답·틀린 기록·모은 유물은 그대로 둠
   (◀ 이전과 같은 원리 — 이미 푼 문제는 다시 맞혀도 점수가 오르지 않음). 끝 화면·제목 화면·제작자 확인 모드는 예전처럼 새로 시작 */
let __rsOK=false;
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('#rs'); if(!b) return;
  if(__rsOK){ __rsOK=false; return; }
  if(DEV||typeof pos==='undefined'||pos<2||document.getElementById('again')||document.querySelector('.rsask')) return;
  e.stopImmediatePropagation(); e.preventDefault();
  const st=document.getElementById('stage'), w=document.createElement('div'); w.className='rsask';
  const tv=MODE==='travel';
  w.innerHTML=`<div class="rsbox"><h2>처음부터 다시 할까요?</h2>
    <p>처음 장면으로 돌아가요. 지금까지의 <b>점수와 고른 답은 그대로</b> 남아요.<br>${tv?'이미 푼 문제는 다시 풀어도 <b>점수가 오르지 않아요.</b>':'이미 푼 문제는 다시 풀어도 <b>점수가 바뀌지 않아요.</b>'}</p>
    <div class="endbtns"><button class="big dark" type="button" id="rsno">계속하기</button><button class="big" type="button" id="rsyes">처음 장면으로</button></div></div>`;
  st.appendChild(w);
  w.querySelector('#rsno').onclick=()=>w.remove();
  w.querySelector('#rsyes').onclick=()=>{ w.remove();
    const keep={}; ['sim','quizPt','quiz','wrong','done','relic','camp','qa','_fj','_fc','_qc'].forEach(k=>{ if(S[k]!==undefined) keep[k]=Array.isArray(S[k])?[...S[k]]:(S[k]&&typeof S[k]==='object'?{...S[k]}:S[k]); });
    document.querySelectorAll('.relicpop,#mus,.mus,.burst,.toast').forEach(x=>x.remove());
    restart(); Object.assign(S,keep); try{ hud(); }catch(_){}
  };
},true);

/* 시트로 보낼 값 (설문 칸 수에 맞춰 자름) */
function sendValues(info,name,curious){
  const v=[name, `${LESSON.name} · ${info.stage}`, info.sim===''?'':info.sim, info.quiz===''?'':info.quiz, info.total, (info.wrong||[]).join(' / '), curious||''];
  return v;
}
function formLink(vals){
  const [fid,...en]=CLASSCODE.slice(1).split('.');
  return `https://docs.google.com/forms/d/e/${fid}/viewform?usp=pp_url&`+en.map((id,i)=>`entry.${id}=${encodeURIComponent(vals[i]??'')}`).join('&');
}
/* 끝 화면의 보내기 칸: 목록 화면 안이면 바깥(목록 화면)에서 보내기 창을 띄움 */
function sendBox(el,info){
  if(!el) return;
  if(!CLASSCODE){ el.innerHTML=`<div class="send-tip">선생님이 이 기기를 <b>우리 반에 연결</b>하면 여기서 점수를 보낼 수 있어요.</div>`; return; }
  el.innerHTML=`<button class="big send-go" type="button" id="sendGo">선생님께 보내기 ▶</button>`;
  const open=()=>{ if(INHUB) window.parent.postMessage({hanguksa:'send',info:{...info,lesson:LESSON.name,ncol:CLASSCODE.split('.').length-1,player:(typeof playerLabel==='function'?playerLabel():'')}},'*'); else sendScreen(info); };
  el.querySelector('#sendGo').onclick=open;
  setTimeout(()=>{ if(el.isConnected && !document.getElementById('sendScr')) open(); },2500);
}
/* 목록 화면 밖에서 열었을 때 쓰는 보내기 화면 */
function sendScreen(info){
  const st=document.getElementById('stage');
  const old=document.getElementById('sendScr'); if(old) old.remove();
  const travel=info.kind==='travel', ncol=CLASSCODE.split('.').length-1;
  const w=document.createElement('div'); w.className='sendscr'; w.id='sendScr';
  w.innerHTML=`<div class="sbox"><h2>선생님께 보내기 · ${info.stage}</h2>
    <div class="sscore">${LESSON.name} · ${travel?`시간 여행 점수 <b>${info.sim}점</b>`:`귀환 퀴즈 <b>${info.quiz}점</b>`}</div>
    <ol class="ssteps">
      <li id="s1"><span class="sn">1</span><div><b>번호와 이름을 써요</b><input id="sname" type="text" maxlength="20" placeholder="예: 3 김하늘" autocomplete="off">${travel&&ncol>=7?`<b style="flex-basis:100%">여행하며 궁금했던 점 (한 줄, 쓰지 않아도 돼요)</b><input id="scur" type="text" maxlength="80" placeholder="예: 주먹도끼는 어떻게 들고 썼을까?" style="width:100%">`:''}</div></li>
      <li id="s2" class="wait"><span class="sn">2</span><div><b>보내기 버튼을 눌러요</b><a id="sendA" class="big send-a off" target="_blank" rel="noopener" aria-disabled="true">보내기</a><small>선생님 설문지가 <b>새 창</b>으로 열려요. 점수와 틀린 선택은 이미 채워져 있어요. <b>아무것도 고치지 말고</b> 제출만 누르면 돼요.</small></div></li>
      <li id="s3" class="wait"><span class="sn">3</span><div><b>새 창 맨 아래 <u>제출</u>을 눌러요</b><small>제출을 눌러야 선생님께 전달돼요.</small><button id="sDone" class="big dark" type="button" disabled>제출까지 했어요 ✓</button></div></li>
    </ol>
    <button class="mini sback" id="sBack" type="button">◀ 돌아가기</button></div>`;
  st.appendChild(w);
  const inp=w.querySelector('#sname'), cur=w.querySelector('#scur'), a=w.querySelector('#sendA'), done=w.querySelector('#sDone');
  const upd=()=>{ const n=inp.value.trim();
    if(n){ a.href=formLink(sendValues(info,n,cur?cur.value.trim():'')); a.classList.remove('off'); a.removeAttribute('aria-disabled'); w.querySelector('#s1').classList.add('ok'); w.querySelector('#s2').classList.remove('wait'); }
    else { a.removeAttribute('href'); a.classList.add('off'); a.setAttribute('aria-disabled','true'); w.querySelector('#s1').classList.remove('ok'); w.querySelector('#s2').classList.add('wait'); } };
  [inp,cur].forEach(x=>{ if(!x) return; x.addEventListener('input',upd); x.addEventListener('keydown',e=>e.stopPropagation()); });
  a.addEventListener('click',()=>{ if(a.classList.contains('off')) return; w.querySelector('#s2').classList.add('ok'); w.querySelector('#s3').classList.remove('wait'); done.disabled=false; });
  done.onclick=()=>{ w.querySelector('.sbox').innerHTML=`<h2>잘했어요!</h2><p class="sthanks">선생님 설문지에서 <b>제출</b>까지 눌렀다면 전달됐어요.<br>제출을 못 눌렀다면 다시 보낼 수 있어요.</p><div class="endbtns"><button class="big" id="sAgain" type="button">다시 보내기</button><button class="big dark" id="sClose" type="button">닫기</button></div>`;
    w.querySelector('#sAgain').onclick=()=>sendScreen(info); w.querySelector('#sClose').onclick=()=>w.remove(); };
  w.querySelector('#sBack').onclick=()=>w.remove();
  if(typeof playerLabel==='function' && playerLabel()){ inp.value=playerLabel(); upd(); }
  setTimeout(()=>inp.focus(),50);
}

/* ===== 시간 여행 끝 화면 ===== */
function travelEnd(done){
  setChars([]); hot.innerHTML='';
  clearResume();
  const r=firstTrack(); let first=true, rep=S.sim, wrong=S.wrong||[], runs=1;
  if(r){ if(r.t.sim==null){ r.t.sim=S.sim; firstSave(r); } else first=false; rep=r.t.sim; wrong=r.t.wrong; runs=r.t.runs; }
  reportDone('시간 여행',rep);
  const wr=wrong.length;
  ui.innerHTML=`<div class="title"><p>${LESSON.name}</p><h1>시간 여행 완료!</h1>
    <div class="tally">${first?`<div><span>시간 여행 점수${runs>1||DEV?'':' · 첫 도전'}</span><b>${S.sim}</b></div>`:`<div><span>첫 도전 점수 (선생님께 가는 점수)</span><b>${rep}</b></div><div><span>이번 다시 여행</span><b>${S.sim}</b></div>`}<div><span>처음에 틀린 선택</span><b>${wr}</b></div></div>
    <p class="small">${first?'':'다시 여행은 연습이에요. 처음에 고른 답이 선생님께 가요. '}수업 시간에 선생님 설명을 듣고, <b style="color:var(--ember)">귀환 퀴즈</b>에 도전하세요!</p>
    <div class="sendbox" id="sendbox"></div>
    <div class="endbtns"><button class="big" id="again" type="button">다시 여행하기</button>${INHUB?'<button class="big dark" id="homeb" type="button">차시 목록으로</button>':'<button class="big dark" id="toq" type="button">귀환 퀴즈로 ▶</button>'}</div></div>`;
  document.getElementById('again').onclick=restart;
  if(INHUB) document.getElementById('homeb').onclick=goHome; else document.getElementById('toq').onclick=()=>{ MODE='quiz'; restart(); };
  sendBox(document.getElementById('sendbox'),{kind:'travel',stage:'시간 여행'+tryTag(runs,'다시 여행'),sim:rep,quiz:'',total:rep,wrong});
}

/* ===== 귀환 퀴즈: 제목 → 오늘의 주제 쓰기 → 문제 ===== */
const LNO=()=>LESSON.name.split(' ')[0];                 /* '12차시' */
const TOPIC=()=>LESSON.name.split(' ').slice(1).join(' '); /* '통일 신라' */
function quizTitle(go){
  setBg(LESSON.quizBg||'void'); setChars([]); hot.innerHTML='';
  ui.innerHTML=`<div class="title"><p>${LNO()}</p><h1>귀환 퀴즈</h1><p>시간 여행에서 돌아왔어요. 선생님 설명을 잘 들었나요?</p><button class="big" id="start" type="button">퀴즈 시작</button>${INHUB?'':'<button class="mini" id="totr" type="button" style="margin-top:1cqw">◀ 시간 여행으로</button>'}</div>`;
  const hd=document.querySelector('.hud'); if(hd) hd.hidden=true;
  document.getElementById('start').onclick=()=>{ if(hd) hd.hidden=false; go(); };
  const tt=document.getElementById('totr'); if(tt) tt.onclick=()=>{ MODE='travel'; restart(); };
}
const normKey=s=>String(s||'').replace(/[\s·.,!?'"()]/g,'').toLowerCase();
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const chosung=s=>[...s].map(c=>{const k=c.charCodeAt(0)-0xAC00; return k>=0&&k<11172?CHO[Math.floor(k/588)]:c;}).join('');
function keyGate(go){
  hot.innerHTML=''; let miss=0;

  ui.innerHTML=`<div class="title"><h1 style="font-size:4.6cqw">오늘의 주제는?</h1><p>${LNO()} 시간 여행과 선생님 설명의 <b style="color:var(--ember)">주제</b>를 써야 퀴즈 문이 열려요.</p>
    <div class="send"><input id="kin" type="text" maxlength="24" placeholder="주제 쓰기" autocomplete="off"><button class="big" id="kgo" type="button">문 열기</button></div>
    <p class="send-tip" id="kmsg">${DEV?`제작자 확인 모드: 주제는 '${TOPIC()}'`:'&nbsp;'}</p></div>`;
  const inp=document.getElementById('kin'), msg=document.getElementById('kmsg');
  const tryKey=()=>{ if(ok.some(k=>normKey(k)===normKey(inp.value))){ go(); return; }

    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); };
  document.getElementById('kgo').onclick=tryKey;

  setTimeout(()=>inp.focus(),50);
}
function quizEnd(n){
  const q=S.quizPt, g=LESSON.grades, gr=v=>v>=160?g[0]:v>=120?g[1]:g[2];
  let rq=q, rn=S.quiz, rw=S.wrong||[], runs=1;
  if(!DEV){ const r=firstRec(); const ks=Object.keys(r.q.ans).filter(k=>+k<n); runs=r.q.runs||1;
    if(ks.length>=n){ rn=ks.reduce((a,k)=>a+r.q.ans[k],0); rq=rn*PT.quiz; rw=r.q.wrong; } }
  const first=runs<=1;
  reportDone('귀환 퀴즈',rq);
  ui.innerHTML=`<div class="title"><p>귀환 퀴즈 결과</p><h1>${gr(q)}</h1>
    <div class="tally">${first?`<div class="tot"><span>귀환 퀴즈 (${S.quiz}/${n})${DEV?'':' · 첫 도전'}</span><b>${q}</b></div>`:`<div class="tot"><span>첫 도전 (${rn}/${n}) · 선생님께 가는 점수</span><b>${rq}</b></div><div><span>이번 다시 풀기 (${S.quiz}/${n})</span><b>${q}</b></div>`}</div>
    <p class="small">4문제 이상 ${g[0]} · 3문제 ${g[1]}${first?'':' · 다시 풀기는 연습이에요'}</p><p>${LESSON.next}</p>
    <div class="sendbox" id="sendbox"></div>
    <div class="endbtns"><button class="big" id="again" type="button">다시 풀기</button>${INHUB?'<button class="big dark" id="homeb" type="button">차시 목록으로</button>':''}</div></div>`;

  sendBox(document.getElementById('sendbox'),{kind:'quiz',stage:'귀환 퀴즈'+tryTag(runs,'다시 풀기'),sim:'',quiz:rq,total:rq,wrong:rw});
}

  let bg='void',night=false,chars=[];
  for(let k=0;k<idx;k++){ const b=Q[k]; if(b.bg) bg=b.bg; if(b.night!==undefined) night=b.night; if(b.chars) chars=b.chars.map(c=>typeof c==='string'?{who:c}:c);

/* ===== 귀환 퀴즈: 한능검 기본 문제 모양 (LESSON.qz 데이터만 차시마다 다르게) =====
   문항: {topic, ask, pt?, src?, opts:[문자열 | {t, ph}], c, e}
   src(자료): {talk:[[이름,말],...]} | {box:'글', title?} | {photo:'사진키', cap, box?} */
function examSrc(s){
  if(!s) return '';
  let h='';
  if(s.photo) h+=`<figure class="xph">${pic(s.photo,s.cap||'')}${s.cap?`<figcaption>${s.cap}</figcaption>`:''}</figure>`;
  if(s.talk) h+=`<div class="xtalk">${s.talk.map(([w,t],k)=>`<div class="xb ${k%2?'r':''}"><b>${w}</b><p>${t}</p></div>`).join('')}</div>`;
  if(s.box) h+=`<div class="xbox">${s.title?`<b class="xt">${s.title}</b>`:''}<div>${s.box}</div></div>`;
  return `<div class="xsrc ${s.photo&&(s.box||s.talk)?'two':''}">${h}</div>`;
}
/* (10-19) 귀환 퀴즈 정답 자리: 예전에는 문제마다 ②④①③② 자리로 늘 같았음 → 열 때마다 섞되 ①~④가 고루, 같은 자리가 연달아 나오지 않게 */
function quizSlots(n){ if(LESSON._slots&&LESSON._slots.length>=n) return LESSON._slots;
  let best=[];
  for(let t=0;t<200;t++){ const a=[]; while(a.length<n){ const g=[0,1,2,3]; for(let k=3;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); [g[k],g[r]]=[g[r],g[k]]; } a.push(...g); }
    const x=a.slice(0,n); best=x; if(x.every((v,k)=>k===0||v!==x[k-1])) break; }
  return LESSON._slots=best; }
function hnkQuiz(done){
  const QZ=LESSON.qz; let i=window.__QSTART||0; window.__QSTART=0;
  const NUM='①②③④⑤';
  const show=()=>{
    if(i>=QZ.length) return quizEnd(QZ.length);
    const q=QZ[i]; hot.innerHTML=''; setChars([]);
    if(!q._ord){ const n=q.opts.length, slot=quizSlots(QZ.length)[i]%n; const rest=q.opts.map((_,k)=>k).filter(k=>k!==q.c);
      for(let k=rest.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[rest[k],rest[r]]=[rest[r],rest[k]];} q._ord=[...rest.slice(0,slot),q.c,...rest.slice(slot)]; }
    const ot=o=>typeof o==='string'?o:o.t;
    const hasPh=q.opts.some(o=>o.ph);
    ui.innerHTML=`<div class="exam"><div class="xq"><span class="xn">${i+1}.</span> ${q.ask} <small>[${q.pt||2}점]</small></div>${examSrc(q.src)}
      <div class="xopts ${hasPh?'ph':''}">${q._ord.map((j,k)=>{const o=q.opts[j];return `<button class="xo" type="button" data-j="${j}"><span class="xnum">${NUM[k]}</span>${o.ph?`<span class="xoph">${pic(o.ph,ot(o))}</span>`:''}<span class="xot">${ot(o)}</span></button>`;}).join('')}</div>
      <div class="xexp" hidden></div></div>`;
    const ex=ui.querySelector('.exam'), btns=ex.querySelectorAll('.xo');
    btns.forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j, ok=j===q.c; if(!ok) noteWrong(ot(q.opts[j]),q.topic);
      if(!DEV){ const r=firstRec(); if(!S._qc){ S._qc=1; r.q.runs++; } if(!(i in r.q.ans)){ r.q.ans[i]=ok?1:0; if(!ok) r.q.wrong=[...new Set([...r.q.wrong,wrongLabel(ot(q.opts[j]),q.topic)])]; } firstSave(r); }
      btns.forEach(x=>{x.disabled=true; const k=+x.dataset.j; if(k===q.c) x.classList.add('xok'); else if(k===j) x.classList.add('xbad');});
      const exp=ex.querySelector('.xexp');
      const after=()=>{ exp.hidden=false; exp.innerHTML=`<div><b class="${ok?'ok':'no'}">${ok?'정답!':'아쉬워요!'}</b> 정답은 <b>${NUM[q._ord.indexOf(q.c)]} ${ot(q.opts[q.c])}</b><p>${q.e}</p></div><button class="xnext" type="button">${i+1<QZ.length?'다음 문제 ▶':'결과 보기 ▶'}</button>`;
        exp.querySelector('button').onclick=()=>{ i++; show(); }; exp.scrollIntoView({block:'nearest'}); };
      S.qa=S.qa||{}; const again=(i in S.qa); if(!again) S.qa[i]=ok?1:0;
      setTimeout(()=>{ if(ok&&!again){ S.quiz++; award(PT.quiz,'정답!',true,true,after); } else if(ok) award(0,'이미 푼 문제예요 (점수 그대로)',true,true,after); else award(0,'아쉬워요',true,true,after); },300);
    });
  };
  show();
}

/* ===== 이름 부르기 · 유물 모으기 · 나만의 작은 박물관 (모든 차시 공통, send.js 바로 뒤에 붙음) =====
   [차시에서 쓰는 법]
   1) 대본 맨 앞(제목 화면 바로 뒤)에 {custom:askName}
   2) 대사에서 이름 부르기:  `${PN()}`(하늘) · `${PNJ('아/야')}`(하늘아) · `${PNJ('이/가')}` · `${PNJ('은/는')}` · `${PNJ('을/를')}`
      (이름을 쓰면 대본을 다시 만들어서 이름이 들어감. 이름을 안 쓰면 '탐험가')
   3) 유물 목록(중요 개념 3~5개, 전시 순서대로):
      LESSON.relics={title:'전시 제목', items:{키:{name:'유물 이름', icon:'아이콘', photo?:'사진 키', cap:'설명판 한 줄', text:'자세한 설명'}}}
   4) 유물 받는 곳: 정답 뒤 then 목록 끝에 RELIC('키')  → 유물 카드 + 특별 점수(+20, 한 번만)
   5) 여행 일지 뒤, 시간 여행 끝 화면 앞에 {custom:museumEnd}  → 어두운 전시실에 조명이 하나씩 켜지는 엔딩
   이름은 이 기기에만 저장(hanguksa_player)하고, '선생님께 보내기' 이름 칸에 미리 채워 줌. */
const RELIC_PT=20;
const PLAYER=Object.assign({no:'',full:''},store.get('hanguksa_player',{}));
const rEsc=s=>String(s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
/* 부를 이름: 한글 3글자 이상이면 성을 뺀 뒤 두 글자(박보환→보환, 남궁민수→민수), 그 밖에는 쓴 그대로 */
function callName(){ const f=String(PLAYER.full||'').replace(/\s+/g,'').slice(0,10); if(!f) return ''; return /^[가-힣]{3,}$/.test(f)?f.slice(-2):f; }
const PN=()=>rEsc(callName()||'탐험가');
const hasBat=w=>{ const c=String(w).charCodeAt(String(w).length-1)-0xAC00; return c>=0&&c<11172&&c%28!==0; };
const JO=(w,pair)=>{ const [a,b]=pair.split('/'); return w+(hasBat(w)?a:b); };
const PNJ=pair=>JO(PN(),pair);
function playerLabel(){ return [PLAYER.no,PLAYER.full].map(x=>String(x||'').trim()).filter(Boolean).join(' '); }
function applyPlayer(){ try{ if(typeof NAMES!=='undefined' && 'me' in NAMES) NAMES.me=callName()||'나'; }catch(e){} }
setTimeout(applyPlayer,0);

/* ---- 이름 쓰기 화면 ---- */

    <p class="small">이름은 이 기기에만 남아요. 마지막에 선생님께 보낼 때 이름 칸에 미리 들어가요.</p></div>`;

/* ---- 유물 그림: 사진이 있고 photo를 지정했으면 액자 사진, 아니면 그림 ---- */
const relicArt=it=>it?(it.photo&&has(it.photo)?`<div class="rph">${pic(it.photo,it.name)}</div>`:(IC[it.icon]||'')):'';
const relicList=()=>{ const R=LESSON.relics||{}; return Object.keys(R.items||{}); };

/* ---- 유물 받기 ---- */
function RELIC(k){ return {custom:Object.assign((go)=>{
  const it=((LESSON.relics||{}).items||{})[k]; if(!it) return go();
  S.relic=S.relic||[]; if(!S.relic.includes(k)) S.relic.push(k);
  const first=once('relic:'+k);

  const items=(LESSON.relics||{}).items||{};

/* ---- 유물 카드·박물관이 떠 있을 때도 '◀ 이전'을 누를 수 있게 (2026-10-15)
   버튼 줄을 유물 카드 덮개(z-index 21) 위로 올리고, 이전으로 갈 때 떠 있던 유물 카드·박물관을 치움 ---- */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#bk,#rs'); if(b&&!b.disabled) document.querySelectorAll('.relicpop,.mus,.burst').forEach(x=>x.remove()); },true); /* 점수 창(.burst)도 함께 치움 (2026-10-19 심화판) */

/* ---- 엔딩: 나만의 작은 박물관 — 조명이 하나씩 켜지고, 마지막에 전시실 전체가 밝아짐 ---- */
function museumEnd(go){
  const R=LESSON.relics; if(!R||!R.items) return go();
  S.relic=S.relic||[];
  const keys=relicList().filter(k=>S.relic.includes(k)||(DEV&&!S.relic.length));
  setChars([]); hot.innerHTML=''; ui.innerHTML='';
  const hd=document.querySelector('.hud'); if(hd) hd.hidden=true;
  const st=document.getElementById('stage');
  const who=rEsc(String(PLAYER.full||'').trim())||'탐험가';
  const w=document.createElement('div'); w.className='mus'; w.id='mus';
  w.innerHTML=`<div class="mwall"></div><div class="mfloor"></div>
    <div class="mhead"><small>${LNO()} 시간 여행 특별전</small><h2>${R.title||TOPIC()}</h2><div class="mby">전시 기획 <b>${who}</b></div></div>
    <div class="mrow n${keys.length}">${keys.map((k,i)=>{ const it=R.items[k]; return `<button type="button" class="mcase" data-k="${k}">
      <span class="mlight"></span><span class="mglass"><span class="mart">${relicArt(it)}</span></span><span class="mplinth"></span>
      <span class="mlabel"><i>${String(i+1).padStart(2,'0')}</i><b>${it.name}</b><small>${it.cap||''}</small></span></button>`; }).join('')}</div>
    <div class="mfoot"><span class="mhint">유물을 누르면 설명을 볼 수 있어요</span><button class="big" id="musnext" type="button">다음으로</button></div>
    <button class="mini mskip" type="button" id="mskip">건너뛰기</button>`;
  st.appendChild(w);
  const cases=[...w.querySelectorAll('.mcase')];
  let i=0, timer=null, finished=false;
  const tip=(k)=>{ const it=R.items[k]; w.querySelectorAll('.mtip').forEach(x=>x.remove());
    const t=document.createElement('div'); t.className='mtip'; t.innerHTML=`<div class="ma">${relicArt(it)}</div><div><small>${it.cap||''}</small><strong>${it.name}</strong><p>${it.text||''}</p></div><span>눌러서 닫기</span>`;
    t.onclick=()=>t.remove(); w.appendChild(t); };
  cases.forEach(c=>c.onclick=()=>{ if(finished) tip(c.dataset.k); });
  const end=()=>{ if(finished) return; finished=true; clearTimeout(timer);
    cases.forEach(c=>c.classList.add('lit')); w.classList.add('open');
    const sk=w.querySelector('#mskip'); if(sk) sk.remove(); };
  w.querySelector('#mskip').onclick=end;
  w.querySelector('#musnext').onclick=()=>{ w.remove(); if(hd) hd.hidden=false; go(); };
  const step=()=>{ if(finished) return; if(i>=cases.length){ timer=setTimeout(end,700); return; } cases[i++].classList.add('lit'); timer=setTimeout(step,1000); };
  timer=setTimeout(step,1100);
}

/* ================= 그림: 인물 ================= */
function eyes(e,x1,x2,y,s){
  if(e==='sad') return `<path d="M${x1-8*s} ${y} Q${x1} ${y+5*s} ${x1+8*s} ${y}" stroke="#2a1d14" stroke-width="${3*s}" fill="none"/><path d="M${x2-8*s} ${y} Q${x2} ${y+5*s} ${x2+8*s} ${y}" stroke="#2a1d14" stroke-width="${3*s}" fill="none"/>`;
  if(e==='smile') return `<path d="M${x1-8*s} ${y+3*s} Q${x1} ${y-6*s} ${x1+8*s} ${y+3*s}" stroke="#2a1d14" stroke-width="${3.4*s}" fill="none"/><path d="M${x2-8*s} ${y+3*s} Q${x2} ${y-6*s} ${x2+8*s} ${y+3*s}" stroke="#2a1d14" stroke-width="${3.4*s}" fill="none"/>`;
  return `<ellipse cx="${x1}" cy="${y}" rx="${6*s}" ry="${8*s}" fill="#2a1d14"/><ellipse cx="${x2}" cy="${y}" rx="${6*s}" ry="${8*s}" fill="#2a1d14"/><circle cx="${x1+2*s}" cy="${y-3*s}" r="${2.2*s}" fill="#fff"/><circle cx="${x2+2*s}" cy="${y-3*s}" r="${2.2*s}" fill="#fff"/>`;
}
function brows(e,x1,x2,y,s,col){
  const t = e==='worry'||e==='sad' ? [4,-4] : e==='surprise'?[-5,-5]:[0,0];
  return `<path d="M${x1-10*s} ${y+t[0]*s} L${x1+9*s} ${y+t[1]*s}" stroke="${col||'#3a2618'}" stroke-width="${4*s}" stroke-linecap="round"/><path d="M${x2-9*s} ${y+t[1]*s} L${x2+10*s} ${y+t[0]*s}" stroke="${col||'#3a2618'}" stroke-width="${4*s}" stroke-linecap="round"/>`;
}
function mouth(e,x,y,s){
  if(e==='smile') return `<path d="M${x-16*s} ${y} Q${x} ${y+18*s} ${x+16*s} ${y}Z" fill="#7a3324"/>`;
  if(e==='surprise') return `<ellipse cx="${x}" cy="${y+4*s}" rx="${7*s}" ry="${9*s}" fill="#7a3324"/>`;
  if(e==='sad'||e==='worry') return `<path d="M${x-12*s} ${y+8*s} Q${x} ${y-2*s} ${x+12*s} ${y+8*s}" stroke="#7a3324" stroke-width="${3.4*s}" fill="none"/>`;
  return `<path d="M${x-12*s} ${y} Q${x} ${y+9*s} ${x+12*s} ${y}" stroke="#7a3324" stroke-width="${3.4*s}" fill="none"/>`;
}

/* 지도에서 모든 곳을 눌러 살펴보기(다 봐야 다음으로) */
function mapLook(o){ return Object.assign((done)=>{
  setBg('map'); setChars([]);
  const P=o.pts, seen={};
  const draw=()=>{
    const n=Object.keys(seen).length;
    ui.innerHTML=`<div class="ask">${o.ask} (${n}/${P.length})</div>`;
    hot.innerHTML=P.map(p=>{const [x,y]=MAPPOS[p.k];return `<div class="maplabel ${p.left?'left':''}" style="left:${x+(p.lx||0)}%;top:${y+(p.ly||0)}%">${p.n}</div>`;}).join('')
     + P.map((p,i)=>{const [x,y]=MAPPOS[p.k];return `<button class="spot sm ${seen[i]?'seen':''}" type="button" style="left:${x}%;top:${y}%" data-i="${i}" aria-label="${p.n}"></button>`;}).join('');
    if(n>=P.length){const nx=document.createElement('button');nx.className='big next';nx.type='button';nx.textContent='다음으로';ui.appendChild(nx);nx.onclick=()=>{hot.innerHTML='';done();};}
    hot.querySelectorAll('.spot').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,p=P[i]; const first=!seen[i]; seen[i]=1; hot.innerHTML='';
      if(first && once('look:'+o.key+':'+p.k)) award(PT.move,o.ok||'발견!');
      say({who:o.who,text:p.t,photo:p.photo,cap:p.cap},()=>{setBg('map');draw();});});
  };
  draw();
},{label:o.ask});}

const fresh=()=>({wrong:[],sim:0,quizPt:0,quiz:0,camp:[],seen:{}});
const PT={good:10,retry:5,bad:-5,spot:2,card:2,craft:5,move:5,sort:2,find:2,quiz:40};
let S=fresh();
const ui=document.getElementById('ui'), hot=document.getElementById('hot'), bgEl=document.getElementById('bg'), chEl=document.getElementById('chars');
const CAMPNAME={chongdok:'조선 총독부',heonbyeong:'헌병 경찰',toji:'토지 조사 사업',sinheung:'신흥 무관 학교',heungsa:'흥사단'};

function hud(newItem){
  const total=S.sim+S.quizPt;
  const st=`<div class="score-pill">${IC.s_star}<div><div class="stl">점수</div><div class="sc">${total}<small>점</small></div></div></div>`;
  const camp=S.camp.map(c=>`<div class="it ${c===newItem?'new':''}" title="${CAMPNAME[c]||c}">${IC[c]}</div>`).join('');
  let h=document.querySelector('.hud');
  if(!h){h=document.createElement('div');h.className='hud';ui.parentNode.insertBefore(h,ui.nextSibling);}
  h.innerHTML=`<div class="stats" style="border:0">${st}</div><div class="right">${camp?`<div class="camp" title="내가 일제 통치 시기에서 모은 것">${camp}</div>`:''}<div class="row-btn"><button class="mini" id="bk" type="button" ${HIST.length<2?'disabled':''}>◀ 이전</button><button class="mini" id="rs" type="button">처음부터</button>${INHUB?'<button class="mini" id="hm" type="button">차시 목록</button>':''}${DEV?'<button class="mini" id="dv" type="button">⚡ 바로가기</button>':''}</div></div>`;
  document.getElementById('rs').onclick=restart; document.getElementById('bk').onclick=goBack; if(INHUB) document.getElementById('hm').onclick=goHome; if(DEV) document.getElementById('dv').onclick=devPanel;
}
function award(n,label,quiz,big,next){
  if(quiz) S.quizPt+=n; else S.sim=Math.max(0,S.sim+n); hud();
  const pill=document.querySelector('.score-pill'); if(pill){pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump');}
  if(big) return burst(n,label,next);
  toast(`${label?label+' ':''}${n>0?'+'+n+'점':n<0?n+'점':'점수 그대로'}`,n<0);
}
function burst(n,label,next){
  document.querySelectorAll('.burst').forEach(e=>e.remove());
  const kind=n>0?'up':n<0?'down':'zero';
  const e=document.createElement('button'); e.type='button'; e.className='burst '+kind; e.setAttribute('aria-label','점수 확인, 눌러서 계속');
  const cols=['#e0614e','#f2c45a','#7fb69a','#6fa8d6','#c9a043','#c77dd1','#ffd36b','#5fb8a8'];
  const balloons= n>0 ? Array.from({length:12},(_,k)=>{const x=4+k*8+Math.random()*4, d=(Math.random()*0.6).toFixed(2), t=(2.6+Math.random()*1.4).toFixed(2), sz=(4.6+Math.random()*2).toFixed(1);
    return `<i class="bl" style="left:${x}%;--c:${cols[k%cols.length]};--s:${sz}cqw;animation-delay:${d}s;animation-duration:${t}s"></i>`;}).join('') : '';
  e.innerHTML=`${balloons}<div class="disc"><div class="num">${n>0?'+'+n:n<0?n:'0'}<small>점</small></div><div class="lab">${label||''}</div></div><div class="tap">화면을 눌러 계속</div>`;
  document.getElementById('stage').appendChild(e);
  let ready=false; setTimeout(()=>{ready=true;e.classList.add('ready');},400);
  e.onclick=()=>{ if(!ready) return; e.remove(); if(next) next(); };
  setTimeout(()=>e.focus(),50);
}

/* 짝 맞추기: 카드(그림·글)를 보고 알맞은 답 고르기. 처음에 맞혀야 점수 */
/* (10-19) 고르기 놀이 문제 순서를 판마다 섞음: 정답이 좌우좌우처럼 번갈아 나오거나 같은 답이 3번 넘게 이어지지 않게 */
function mixItems(items){
  const ans=x=>x.map(t=>t.a).join('');
  const bad=x=>{ const a=x.map(t=>t.a); let run=1,maxRun=1,alt=a.length>=4;
    for(let k=1;k<a.length;k++){ run=a[k]===a[k-1]?run+1:1; maxRun=Math.max(maxRun,run); if(k>=2&&a[k]!==a[k-2]) alt=false; if(a[k]===a[k-1]) alt=false; }
    return (maxRun>2?maxRun:0)+(alt?10:0); };
  let best=null,bs=1e9;
  for(let t=0;t<300;t++){ const x=items.map((it,k)=>({...it,_o:k})); for(let k=x.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); [x[k],x[r]]=[x[r],x[k]]; }
    const sc=bad(x)+(ans(x)===ans(items)?1:0); if(sc<bs){ bs=sc; best=x; } if(sc===0) break; }
  return best;
}
