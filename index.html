<style>
/* 교과서판: 아이스크림 사회 5-2 단원·소단원 띠 아래에 차시 카드. 심화판 목록 화면과 같은 틀. 기기 저장 이름만 따로(hanguksa_tb_*) */
/* Layout: 시대별 띠(선사~현대) 아래에 차시 카드를 연표처럼 늘어놓은 목록. 고른 차시는 같은 화면 위에 꽉 차게 열림. 밤하늘 남색 바탕 + 금빛, 시대마다 띠 색이 다름 */
:root{

  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);word-break:keep-all}
*{box-sizing:border-box}
button,input{font:inherit}

.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

.cls{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cls .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.cls .chip.on{border-color:var(--ok);color:var(--ok)}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.tbtn:hover{border-color:var(--gold)}
.era{display:flex;flex-direction:column;gap:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ls{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px;color:var(--fg);min-height:96px;cursor:pointer}
.ls .no{font-family:var(--f-display);font-size:24px;color:var(--c);line-height:1;font-variant-numeric:tabular-nums}
.ls .nm{font-size:15px;line-height:1.35}
.ls .pg{font-size:12px;color:var(--muted)}
.era h2 .u{font-family:var(--f-body);font-size:13px;color:var(--bg);background:var(--c);border-radius:6px;padding:1px 8px;align-self:center}
.ls .st{margin-top:auto;font-size:12px;color:var(--muted)}
.ls.open{cursor:default}
.ls .acts{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.ls .act{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--fg);font-size:13px;cursor:pointer;text-align:left}

/* 게임 화면 */

   </ol><div class="msg" id="smsg"></div>

/* 사본용 원본 (2026-10-13 오후): TPL = '<원본 시트 ID>|<설문지 칸 번호 7개를 .으로>' — build_hub.py 네 번째·다섯 번째 값으로 넣음.
   설문지가 연결된 시트를 사본으로 만들면 설문지도 함께 복사되고 연결도 유지됨. 칸 번호(entry)도 그대로라서
   선생님은 사본 설문지 주소만 붙여 넣으면 됨. (설문지 파일은 '뷰어' 공유가 안 되어 시트로 사본을 만듦) */
const TPL=(()=>{ const c='1x76tt2l8opitBDchRDDWt96x-B001GJxf2uyvVPOJx0|981532219.965218239.1122624127.1256232337.1546162627.15056417.871002081'; const m=c.match(/^([A-Za-z0-9_-]{20,})\|(\d+(?:\.\d+){6})$/); return m?{id:m[1],en:m[2].split('.')}:null; })();
function parseForm(t){
  if(!/docs\.google\.com\/forms|forms\.gle/.test(t)){ const c=t.match(CODE_RE); if(c) return {code:c[0],n:c[0].split('.').length-1}; }
  if(/forms\.gle\//.test(t)) return {err:'짧은 주소(forms.gle)는 쓸 수 없어요. '+(TPL?'시트 메뉴 도구 → 양식 관리 → 현재 설문지로 이동을 누르고, 열린 창의 주소창 주소를 복사해 주세요.':'5번 순서대로 미리 작성 링크를 복사해 주세요.')};
  if(/docs\.google\.com\/forms\/d\/(?!e\/)[A-Za-z0-9_-]{20,}\/edit/.test(t)) return {err:'설문지를 고치는 화면(편집) 주소예요. '+(TPL?'시트 메뉴 도구 → 양식 관리 → 현재 설문지로 이동을 누르고, 열린 창의 주소창 주소를 복사해 주세요.':'5번 순서대로 미리 작성 링크를 복사해 주세요.')};
  const m=t.match(/docs\.google\.com\/forms\/d\/e\/([A-Za-z0-9_-]{20,})\/(?:viewform|formResponse)(\?[^\s]*)?/);
  if(!m) return {err:'📝 설문지 주소가 아니에요. (📊 시트 주소가 아니에요!) '+(TPL?'2번 순서대로 다시 복사해 주세요.':'순서대로 다시 복사해 주세요.')};
  const ids=[...(m[2]||'').matchAll(/entry\.(\d+)=/g)].map(x=>x[1]);
  if(ids.length>=5) return {code:'f'+m[1]+'.'+ids.slice(0,7).join('.'),n:Math.min(7,ids.length)};
  if(TPL&&!ids.length) return {code:'f'+m[1]+'.'+TPL.en.join('.'),n:7,tpl:true};
  return {err:ids.length?`칸이 ${ids.length}개만 채워졌어요. 모든 칸에 아무 글자나 써 주세요.`:'미리 작성 링크가 아니에요. 순서대로 다시 복사해 주세요.'};
}

/* ===== 우리 반 결과 보기: 구글 시트를 복사해 붙여 넣으면 차시별로 정리 (어디에도 저장·전송하지 않음) ===== */
const C_PRE='#c27d22', C_POST='#3a8fd0';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseTSV(t){ const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"'&&cell==='') q=true;
    else if(ch==='\t'){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function readSheet(t){
  const rows=parseTSV(t); if(!rows.length) return {err:'붙여 넣은 내용이 없어요.'};
  let base=-1, start=0;
  const hi=rows.findIndex(r=>r.some(c=>c.trim()==='이름'));
  if(hi>=0){ base=rows[hi].findIndex(c=>c.trim()==='이름'); start=hi+1; }
  else { const r=rows[0]; base=/\d{4}[.\-/]/.test(r[0]||'')&&!/차시/.test(r[0])?1:0; }
  const out=[];
  rows.slice(start).forEach(r=>{
    const name=(r[base]||'').trim(), ls=(r[base+1]||'').trim(); const m=ls.replace(/\s/g,'').match(/(\d+)-(\d+(?:~\d+)?)차시/);
    if(!name||!m||/선생님 시험/.test(name)) return;
    const n=CH.indexOf(m[1]+'-'+m[2])+1; if(!n) return; const quiz=/귀환|퀴즈|확인/.test(ls);
    const num=v=>{ const x=parseFloat(String(v||'').replace(/[^\d.\-]/g,'')); return isNaN(x)?null:x; };
    const wrong=String(r[base+5]||'').split(/\s+\/\s+/).map(s=>s.trim()).filter(Boolean).map(s=>{ const k=s.match(/^\[(.+?)\]\s*(.*)$/); return k?{topic:k[1],ans:k[2]||'(답 없음)'}:{topic:'기타',ans:s}; });
    const tm=ls.match(/다시 (?:여행|풀기) (\d+)회/);
    out.push({name,n,quiz,t:num(r[base+2]),q:num(r[base+3]),wrong,cur:String(r[base+6]||'').trim(),tries:tm?+tm[1]:0});
  });
  if(!out.length) return {err:'학생 응답을 찾지 못했어요. 📝 설문지가 아니라 📊 구글 시트에서 Ctrl+A → Ctrl+C로 전체를 복사했는지 확인해 주세요.'};
  return {rows:out};
}
function buildLessons(rows){
  const L={}; rows.forEach(r=>{ const l=L[r.n]||(L[r.n]={n:r.n,pre:{},post:{}}); (r.quiz?l.post:l.pre)[r.name]=r; }); /* 같은 학생이 여러 번 보내면 마지막 것 */
  return L;
}

    const d=full?`M${C} ${C-R}A${R} ${R} 0 1 1 ${C-0.01} ${C-R}L${C-0.01} ${C-r}A${r} ${r} 0 1 0 ${C} ${C-r}Z`
      :(()=>{const[x1,y1]=pt(R,a0),[x2,y2]=pt(R,a1),[x3,y3]=pt(r,a1),[x4,y4]=pt(r,a0);return `M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z`;})();
    arcs.push(`<path d="${d}" fill="${g.color}" stroke="var(--panel)" stroke-width="2"><title>${esc(g.label)}: ${g.value}명 (${Math.round(g.value/tot*100)}%)${g.who?' · '+esc(g.who):''}</title></path>`); a0=a1; });
  return `<div class="dn"><svg viewBox="0 0 140 140" role="img" aria-label="${esc(center)} ${esc(sub||'')}">${arcs.join('')}<text x="70" y="68" text-anchor="middle" class="dc">${center}</text><text x="70" y="86" text-anchor="middle" class="ds">${sub||''}</text></svg>
    <ul class="dl">${segs.map(g=>`<li><i style="background:${g.color}"></i><span>${esc(g.label)}</span><b>${g.value}명</b><em>${Math.round(g.value/tot*100)}%</em></li>`).join('')}</ul></div>`;
}
function renderLesson(l,ns){
  const pre=Object.values(l.pre), post=Object.values(l.post);
  const names=[...new Set([...Object.keys(l.pre),...Object.keys(l.post)])].sort((x,y)=>x.localeCompare(y,'ko'));
  const avg=(a,k)=>{ const v=a.map(r=>r[k]).filter(x=>x!==null); return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):'-'; };
  /* 개념별: 몇 명이 틀렸는지 (학생 수 기준) */
  const TP={};
  const add=(rs,side)=>rs.forEach(r=>{ const seen=new Set(); r.wrong.forEach(w=>{ const t=TP[w.topic]||(TP[w.topic]={topic:w.topic,pre:new Set(),post:new Set(),ansPre:{},ansPost:{}});
    t[side].add(r.name); const A=side==='pre'?t.ansPre:t.ansPost; (A[w.ans]||(A[w.ans]=new Set())).add(r.name); }); });
  add(pre,'pre'); add(post,'post');
  const rp=t=>t.pre.size/(pre.length||1), rq=t=>t.post.size/(post.length||1);
  const tops=Object.values(TP).sort((x,y)=>rp(y)-rp(x)||rq(y)-rq(x));
  const topPre=tops.filter(t=>t.pre.size).sort((x,y)=>rp(y)-rp(x))[0], topPost=[...tops].filter(t=>t.post.size).sort((x,y)=>rq(y)-rq(x))[0];
  const hero=!tops.length?(pre.length||post.length?`이 차시에서는 <b>틀린 선택이 없어요.</b> 모두 잘 이해했어요!`:''):
    [topPre?`설명 전 가장 많이 헷갈린 개념: <b>${esc(topPre.topic)}</b> (${pre.length}명 중 ${topPre.pre.size}명)`:'',
     topPost?`설명 후에도 남은 오개념: <b>${esc(topPost.topic)}</b> (${post.length}명 중 ${topPost.post.size}명)`:(post.length?`설명 후 귀환 퀴즈에서는 <b>모두 맞혔어요!</b>`:'')].filter(Boolean).join('<br>');
  const bar=(cnt,tot,c,lab,who)=>`<div class="br" title="${lab}: ${esc([...who].join(', ')||'없음')}"><div class="tr"><div class="f" style="width:${tot?cnt/tot*100:0}%;background:${c}"></div></div><em>${tot?`${cnt}/${tot}명`:'-'}</em></div>`;
  const ansList=(A)=>Object.entries(A).sort((x,y)=>y[1].size-x[1].size).map(([ans,w])=>`<p>“${esc(ans)}” <span class="k">— ${w.size}명 (${esc([...w].join(', '))})</span></p>`).join('')||'<p class="k">없음</p>';
  const chart=tops.length?`<div class="card"><h3>많이 틀린 개념</h3>
    <div class="leg"><span><i style="background:${C_PRE}"></i>시간 여행 (설명 전)</span><span><i style="background:${C_POST}"></i>귀환 퀴즈 (설명 후)</span><span>· 개념을 누르면 학생들이 고른 오답이 보여요</span></div>
    ${tops.map(t=>`<details class="tp"><summary><span class="nm">${esc(t.topic)}</span><div class="bars">${bar(t.pre.size,pre.length,C_PRE,'시간 여행에서 틀린 학생',t.pre)}${bar(t.post.size,post.length,C_POST,'귀환 퀴즈에서 틀린 학생',t.post)}</div></summary>
      <div class="det">${t.pre.size?`<div class="detpie">${donut([...Object.entries(t.ansPre).sort((x,y)=>y[1].size-x[1].size).slice(0,2).map(([a,w],i)=>({label:'“'+a+'”',value:w.size,color:DC[i+1],who:[...w].join(', ')})),
        ...(Object.keys(t.ansPre).length>2?[{label:'그 밖의 오답',value:Object.entries(t.ansPre).sort((x,y)=>y[1].size-x[1].size).slice(2).reduce((s,[a,w])=>s+w.size,0),color:DGRAY}]:[]),
        {label:'틀리지 않음',value:Math.max(0,pre.length-t.pre.size),color:DC[0]}],t.pre.size+'/'+pre.length,'명 오답')}</div>`:''}<p class="k">시간 여행에서 고른 오답</p>${ansList(t.ansPre)}<p class="k" style="margin-top:6px">귀환 퀴즈에서 고른 오답</p>${ansList(t.ansPost)}</div></details>`).join('')}</div>`:'';
  const gq=post.map(r=>r.q).filter(x=>x!==null), wc=pre.map(r=>new Set(r.wrong.map(w=>w.ans)).size);
  const whoOf=f=>post.filter(f).map(r=>r.name).join(', '), whoPre=f=>pre.filter(f).map(r=>r.name).join(', ');
  const pies=(pre.length||post.length)?`<div class="pies">
    <div class="card"><h3>귀환 퀴즈 등급 <small>(설명 후)</small></h3>${donut([
      {label:'박사 (4문제 이상)',value:gq.filter(q=>q>=160).length,color:DC[0],who:whoOf(r=>r.q>=160)},
      {label:'탐험가 (3문제)',value:gq.filter(q=>q>=120&&q<160).length,color:DC[1],who:whoOf(r=>r.q>=120&&r.q<160)},
      {label:'새내기 (2문제 이하)',value:gq.filter(q=>q<120).length,color:DC[2],who:whoOf(r=>r.q!==null&&r.q<120)}],gq.length+'명','귀환 퀴즈')}</div>
    <div class="card"><h3>시간 여행에서 처음에 틀린 선택 <small>(설명 전)</small></h3>${donut([
      {label:'0개 (모두 한 번에)',value:wc.filter(n=>n===0).length,color:DC[0],who:whoPre(r=>!r.wrong.length)},
      {label:'1~2개',value:wc.filter(n=>n>=1&&n<=2).length,color:DC[1],who:whoPre(r=>{const n=new Set(r.wrong.map(w=>w.ans)).size;return n>=1&&n<=2;})},
      {label:'3개 이상',value:wc.filter(n=>n>=3).length,color:DC[2],who:whoPre(r=>new Set(r.wrong.map(w=>w.ans)).size>=3)}],pre.length+'명','시간 여행')}</div>
  </div>`:'';
  const rowsH=names.map(nm=>{ const a=l.pre[nm], b=l.post[nm]; const tv=a?.t??null, qv=b?.q??null;
    const wt=r=>r?[...new Set(r.wrong.map(w=>w.topic))].map(esc).join(', ')||'없음':'-';
    const rt=r=>r&&r.tries?` <small class="rt" title="처음부터 다시 한 횟수 (점수는 첫 도전)">다시 ${r.tries}</small>`:'';
    return `<tr><td>${esc(nm)}</td><td class="n">${tv??'-'}${rt(a)}</td><td class="n">${qv??'-'}${rt(b)}</td><td>${wt(a)}</td><td>${wt(b)}</td></tr>`; }).join('');
  const curs=[...pre,...post].filter(r=>r.cur).map(r=>`<li>${esc(r.cur)} <span class="none">— ${esc(r.name)}</span></li>`).join('');
  return `<div class="tabs" role="group" aria-label="차시 고르기">${ns.map(n=>`<button type="button" data-n="${n}" aria-pressed="${n===l.n}">${CH[n-1]}차시</button>`).join('')}</div>
    <h3 style="margin:0;font-size:22px">${chLabel(l.n).full} ${esc(T[l.n-1]||'')}</h3>
    ${hero?`<div class="hero">${hero}</div>`:''}
    <div class="tiles"><div class="tile"><span>시간 여행 (설명 전)</span><b>${pre.length}</b><small>명 · 평균 ${avg(pre,'t')}점</small></div>
      <div class="tile"><span>귀환 퀴즈 (설명 후)</span><b>${post.length}</b><small>명 · 평균 ${avg(post,'q')}점</small></div></div>
    ${pies}
    ${chart}
    <div class="card"><h3>학생별</h3><p class="rtnote">점수는 모두 <b>첫 도전</b> 기준이에요. <span class="rt">다시 n</span> = 처음부터 다시 한 횟수</p><div class="tbl"><table><thead><tr><th>이름</th><th>시간 여행</th><th>귀환 퀴즈</th><th>틀린 개념 (설명 전)</th><th>틀린 개념 (설명 후)</th></tr></thead><tbody>${rowsH}</tbody></table></div></div>
    <div class="card"><h3>궁금한 점</h3>${curs?`<ul class="cur">${curs}</ul>`:'<p class="none" style="margin:0">아직 없어요.</p>'}</div>`;
}

/* 📱 패드 안내: 게임 목록 QR 코드 + 학생 패드에서 하는 방법 (인쇄해서 나눠 주거나 TV에 띄움) */
function openPad(){
  const url=(GAME_URL&&!GAME_URL.startsWith('__'))?GAME_URL:location.href.split('#')[0];
  let svg=''; try{ const q=qrcode(0,'M'); q.addData(url); q.make(); svg=q.createSvgTag({cellSize:6,margin:2,scalable:true}); }catch(e){ svg=''; }
  const s=document.createElement('div'); s.className='sheet padS'; s.id='padS';
  s.innerHTML=`<div class="in" role="dialog" aria-modal="true" aria-labelledby="pd3">
   <h3 id="pd3">📱 패드로 한국사 게임 하기</h3>
   <div class="qrrow"><div class="qr">${svg||'QR을 만들지 못했어요'}</div>
    <div><span class="big3">패드 <b>카메라</b>로<br>이 QR 코드를 찍어요</span><span class="url">${url}</span></div></div>
   <ol>
    <li>QR을 찍으면 뜨는 알림(링크)을 눌러 <b>게임 목록</b>을 열어요.</li>
    <li>패드를 <b>가로로</b> 돌려요. 세로로 들면 화면이 작아져요.</li>
    <li><b>홈 화면에 추가</b>하면 다음부터 아이콘만 누르면 돼요.<br><small>아이패드(Safari): 공유 버튼 ⬆ → ‘홈 화면에 추가’ · 갤럭시탭(크롬·삼성 인터넷): 메뉴 ⋮ 또는 ≡ → ‘홈 화면에 추가’</small></li>
    <li>처음 한 번만 첫 화면 <b>‘우리 반 연결’</b> 칸에 선생님이 알려 준 <b>반 연결 코드</b>를 붙여 넣어요.</li>
    <li>오늘 배울 차시의 <b>시간 여행</b>(수업 전) 또는 <b>귀환 퀴즈</b>(수업 후)를 눌러요.</li>
   </ol>
   ${CODE?`<div class="code noprint"><b>우리 반 연결 코드</b><small>학급 게시판(클래스룸·패들렛 등)에 올려 두면 학생이 패드에서 복사해 붙여 넣기 쉬워요.</small><input id="pdc" readonly value="${CODE}"><div class="row"><button class="pbtn" id="pdcp" type="button">반 연결 코드 복사</button></div><div class="msg" id="pdm"></div></div>`:`<small class="noprint">아직 반 연결이 안 되어 있어요. <b>선생님 설정</b>을 먼저 하면 학생들이 점수를 보낼 수 있어요.</small>`}
   <small>교과서 사진·삽화 없이 자유 이용 사진과 직접 그린 그림만 써서, 패드·집에서도 똑같이 볼 수 있어요.</small>
   <div class="row noprint"><button class="pbtn" id="pdpr" type="button">🖨 인쇄하기</button><button class="pbtn ghost" id="pdx" type="button">닫기</button></div></div>`;
  document.body.appendChild(s);
  s.querySelector('#pdx').onclick=()=>s.remove();
  s.querySelector('#pdpr').onclick=()=>window.print();
  s.addEventListener('click',e=>{ if(e.target===s) s.remove(); });
  const cp=s.querySelector('#pdcp'); if(cp) cp.onclick=()=>{ const i=s.querySelector('#pdc'), m=s.querySelector('#pdm');
    navigator.clipboard.writeText(i.value).then(()=>{m.className='msg ok';m.textContent='반 연결 코드를 복사했어요.';},()=>{i.select();m.className='msg';m.textContent='코드를 선택했어요. Ctrl+C로 복사하세요.';}); };
}
